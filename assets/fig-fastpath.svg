<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t5 d5">
  <title id="t5">From a quantum calculation to a sub-second prediction, with a fallback</title>
  <desc id="d5">Each site is described by sorted partial charges from its neighbourhood, a gradient boosting model predicts the affinity, and a companion forest reports how confident it is. Unconfident sites are sent back to the quantum workflow.</desc>

  <defs>
    <linearGradient id="fp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17524a"/>
      <stop offset="60%" stop-color="#1d5e50"/>
      <stop offset="100%" stop-color="#2f6e5c"/>
    </linearGradient>
    <pattern id="fp-hex" width="42" height="72.75" patternUnits="userSpaceOnUse">
      <path d="M21 0 L42 12.12 L42 36.37 L21 48.5 L0 36.37 L0 12.12 Z M21 48.5 L21 72.75"
            fill="none" stroke="#dff5ec" stroke-width=".8" opacity=".07"/>
    </pattern>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#cfe4da"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="url(#fp-bg)"/>
  <rect width="880" height="470" fill="url(#fp-hex)"/>

  <g font-family="'Josefin Sans',system-ui,sans-serif">
    <text x="40" y="54" font-size="24" letter-spacing="2.6" fill="#f2f5f1">TWO MINUTES, OR A THIRD OF A SECOND</text>
    <text x="40" y="80" font-size="14.5" letter-spacing=".8" fill="#a9c6ba">The model learns the quantum answer from the charges around each site — and says when it is out of its depth.</text>

    <!-- ===== 1. the neighbourhood ===== -->
    <g transform="translate(40 110)">
      <rect width="246" height="168" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="18" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">01</text>

      <g transform="translate(78 92)">
        <circle cx="0" cy="0" r="52" fill="none" stroke="#5e9183" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>
        <circle cx="0" cy="0" r="34" fill="none" stroke="#5e9183" stroke-width="1" stroke-dasharray="3 4" opacity=".8"/>
        <circle cx="0" cy="0" r="17" fill="none" stroke="#5e9183" stroke-width="1" stroke-dasharray="3 4"/>
        <g fill="#dce9e2" opacity=".75">
          <circle cx="17" cy="0" r="3.4"/><circle cx="-12" cy="12" r="3.4"/><circle cx="-5" cy="-16" r="3.4"/>
          <circle cx="32" cy="-12" r="3.4"/><circle cx="-30" cy="-16" r="3.4"/><circle cx="-24" cy="24" r="3.4"/>
          <circle cx="14" cy="31" r="3.4"/>
          <circle cx="50" cy="12" r="3.4"/><circle cx="-46" cy="-24" r="3.4"/><circle cx="26" cy="-45" r="3.4"/>
          <circle cx="-14" cy="50" r="3.4"/>
        </g>
        <circle cx="0" cy="0" r="7" fill="#f3bd8c"/>
      </g>

      <text x="18" y="134" font-size="13.5" letter-spacing="1.5" fill="#f2f5f1">THE SITE IN CONTEXT</text>
      <text x="18" y="152" font-size="11.5" fill="#a9c6ba">partial charges, out to three bonds</text>
    </g>
    <path d="M292 194 h20" stroke="#cfe4da" stroke-width="1.2" fill="none" marker-end="url(#fp-arrow)" opacity=".75"/>

    <!-- ===== 2. the descriptor ===== -->
    <g transform="translate(318 110)">
      <rect width="246" height="168" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="18" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">02</text>

      <g transform="translate(18 52)" fill="#9fd8c4" opacity=".85">
        <rect x="0" y="22" width="7" height="30" rx="1.5"/>
        <rect x="11" y="10" width="7" height="42" rx="1.5"/>
        <rect x="22" y="28" width="7" height="24" rx="1.5"/>
        <rect x="33" y="4" width="7" height="48" rx="1.5"/>
        <rect x="44" y="34" width="7" height="18" rx="1.5"/>
        <rect x="55" y="18" width="7" height="34" rx="1.5"/>
        <rect x="66" y="40" width="7" height="12" rx="1.5"/>
        <rect x="77" y="26" width="7" height="26" rx="1.5"/>
        <rect x="88" y="14" width="7" height="38" rx="1.5"/>
        <rect x="99" y="36" width="7" height="16" rx="1.5"/>
        <rect x="110" y="24" width="7" height="28" rx="1.5"/>
        <rect x="121" y="44" width="7" height="8" rx="1.5"/>
        <rect x="132" y="30" width="7" height="22" rx="1.5"/>
        <rect x="143" y="20" width="7" height="32" rx="1.5"/>
        <rect x="154" y="38" width="7" height="14" rx="1.5"/>
        <rect x="165" y="28" width="7" height="24" rx="1.5"/>
        <rect x="176" y="42" width="7" height="10" rx="1.5"/>
        <rect x="187" y="34" width="7" height="18" rx="1.5"/>
        <rect x="198" y="46" width="7" height="6" rx="1.5"/>
      </g>
      <text x="18" y="124" font-size="11" fill="#8fb3a6" letter-spacing=".6">sorted by priority, nearest shell first</text>

      <text x="18" y="148" font-size="13.5" letter-spacing="1.5" fill="#f2f5f1">53 NUMBERS</text>
      <text x="152" y="148" font-size="11.5" fill="#a9c6ba">one atom's fingerprint</text>
    </g>
    <path d="M570 194 h20" stroke="#cfe4da" stroke-width="1.2" fill="none" marker-end="url(#fp-arrow)" opacity=".75"/>

    <!-- ===== 3. the models ===== -->
    <g transform="translate(596 110)">
      <rect width="244" height="168" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="18" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">03</text>

      <g transform="translate(40 58)" fill="none" stroke="#dce9e2" stroke-width="1.3" opacity=".6">
        <path d="M24 0 V10 M24 10 L8 24 M24 10 L40 24 M8 24 L0 38 M8 24 L16 38 M40 24 L32 38 M40 24 L48 38"/>
        <g transform="translate(76 0)" opacity=".55">
          <path d="M24 0 V10 M24 10 L8 24 M24 10 L40 24 M8 24 L0 38 M8 24 L16 38 M40 24 L32 38 M40 24 L48 38"/>
        </g>
        <g transform="translate(140 0)" opacity=".3">
          <path d="M24 0 V10 M24 10 L8 24 M24 10 L40 24 M8 24 L0 38 M8 24 L16 38 M40 24 L32 38 M40 24 L48 38"/>
        </g>
      </g>

      <text x="18" y="128" font-size="24" fill="#f2f5f1">0.36 s</text>
      <text x="102" y="128" font-size="11.5" fill="#8fb3a6">per molecule</text>

      <text x="18" y="152" font-size="11.5" fill="#a9c6ba">on a single CPU core</text>
    </g>

    <!-- ===================== the gate ===================== -->
    <g transform="translate(40 306)">
      <text x="0" y="0" font-size="13" letter-spacing="1.8" fill="#a9c6ba">AND A SECOND MODEL ASKS: HOW SURE ARE WE?</text>

      <g transform="translate(0 16)">
        <rect width="390" height="72" rx="5" fill="#0f453c" opacity=".45" stroke="#6fb49a" stroke-width="1"/>
        <text x="22" y="30" font-size="14" letter-spacing="1.6" fill="#9fd8c4">CONFIDENT</text>
        <text x="22" y="54" font-size="12.5" fill="#a9c6ba">take the prediction and move on</text>
      </g>

      <g transform="translate(410 16)">
        <rect width="390" height="72" rx="5" fill="#0f453c" opacity=".45" stroke="#c98b63" stroke-width="1"/>
        <text x="22" y="30" font-size="14" letter-spacing="1.6" fill="#f3bd8c">UNSURE</text>
        <text x="22" y="54" font-size="12.5" fill="#a9c6ba">hand this one back to the quantum workflow</text>
      </g>
    </g>

    <text x="40" y="420" font-size="12.5" fill="#a9c6ba" letter-spacing=".4">
      Spending quantum chemistry on the least confident quarter of sites catches most of the worst mistakes.
    </text>
    <text x="40" y="442" font-size="12.5" fill="#8fb3a6" letter-spacing=".4">
      The workflow it stands in for needs around two minutes per molecule on eight cores.
    </text>
  </g>
</svg>
