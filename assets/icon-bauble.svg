<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="bt">
  <title id="bt">Christmas bauble</title>
  <defs>
    <clipPath id="ball">
      <circle cx="60" cy="74" r="36"/>
    </clipPath>
    <!-- four-pointed sparkle, centred on the origin -->
    <path id="spark"
          d="M0 -10 C0 -4 4 0 10 0 C4 0 0 4 0 10 C0 4 -4 0 -10 0 C-4 0 0 -4 0 -10 Z"/>
  </defs>

  <!-- sparkles, in the space around the bauble -->
  <g>
    <use href="#spark" transform="translate(16 50) scale(0.82)" fill="#b2704a"/>
    <use href="#spark" transform="translate(102 42) scale(0.58)" fill="#1d5e50" opacity=".75"/>
    <use href="#spark" transform="translate(14 90) scale(0.5)" fill="#b2704a" opacity=".7"/>
    <use href="#spark" transform="translate(101 93) scale(0.7)" fill="#b2704a" opacity=".85"/>
  </g>

  <g transform="translate(60 60) scale(0.84) translate(-60 -60)">
    <!-- hanger -->
    <circle cx="60" cy="15" r="7.5" fill="none" stroke="#1d5e50" stroke-width="3"/>
    <rect x="51" y="21" width="18" height="12" rx="2.5" fill="#b2704a" stroke="#1d5e50" stroke-width="2"/>

    <!-- body -->
    <circle cx="60" cy="74" r="36" fill="#1d5e50"/>
    <g clip-path="url(#ball)">
      <rect x="18" y="58" width="84" height="11" fill="#b2704a"/>
      <rect x="18" y="86" width="84" height="7" fill="#f4f4f0" opacity=".8"/>
      <ellipse cx="45" cy="56" rx="11" ry="7" fill="#f4f4f0" opacity=".28" transform="rotate(-30 45 56)"/>
    </g>
    <circle cx="60" cy="74" r="36" fill="none" stroke="#14463c" stroke-width="2.4"/>
  </g>
</svg>
