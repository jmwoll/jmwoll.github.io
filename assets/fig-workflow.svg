<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t2 d2">
  <title id="t2">The WISP workflow, from dataset to score</title>
  <desc id="d2">Four stages: a dataset of SMILES, a model you bring or WISP trains, an atom attributor that mutates each atom to see how the prediction moves, matched molecular pairs, and the resulting scores.</desc>

  <defs>
    <linearGradient id="wf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17524a"/>
      <stop offset="60%" stop-color="#1d5e50"/>
      <stop offset="100%" stop-color="#2f6e5c"/>
    </linearGradient>
    <pattern id="wf-hex" width="42" height="72.75" patternUnits="userSpaceOnUse">
      <path d="M21 0 L42 12.12 L42 36.37 L21 48.5 L0 36.37 L0 12.12 Z M21 48.5 L21 72.75"
            fill="none" stroke="#dff5ec" stroke-width=".8" opacity=".07"/>
    </pattern>
    <marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#cfe4da"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="url(#wf-bg)"/>
  <rect width="880" height="430" fill="url(#wf-hex)"/>

  <g font-family="'Josefin Sans',system-ui,sans-serif">
    <text x="40" y="54" font-size="24" letter-spacing="2.6" fill="#f2f5f1">HOW WISP WORKS</text>
    <text x="40" y="80" font-size="14.5" letter-spacing=".8" fill="#a9c6ba">Any model, any descriptor — the workflow only ever asks the model for predictions.</text>

    <!-- ===== 1. dataset ===== -->
    <g transform="translate(40 116)">
      <rect width="180" height="196" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="16" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">01</text>
      <g transform="translate(26 44)" fill="none" stroke="#dce9e2" stroke-width="1.6" opacity=".55">
        <path d="M0 10 l16 -9 l16 9 v18 l-16 9 l-16 -9 z"/>
        <path d="M46 10 l16 -9 l16 9 v18 l-16 9 l-16 -9 z"/>
        <path d="M92 10 l16 -9 l16 9 v18 l-16 9 l-16 -9 z"/>
      </g>
      <g font-size="10.5" fill="#86a99c" font-family="ui-monospace,SFMono-Regular,monospace">
        <text x="26" y="106">CC(=O)Nc1ccccc1</text>
        <text x="26" y="122">c1ccc(Cl)cc1</text>
        <text x="26" y="138">CCOc1ccc(N)cc1</text>
      </g>
      <text x="16" y="160" font-size="14" letter-spacing="1.6" fill="#f2f5f1">THE DATA</text>
      <text x="16" y="178" font-size="11.5" fill="#a9c6ba">SMILES strings and</text>
      <text x="16" y="194" font-size="11.5" fill="#a9c6ba">one measured property</text>
    </g>
    <path d="M226 214 h20" stroke="#cfe4da" stroke-width="1.2" fill="none" marker-end="url(#wf-arrow)" opacity=".75"/>

    <!-- ===== 2. model ===== -->
    <g transform="translate(252 116)">
      <rect width="180" height="196" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="16" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">02</text>
      <g transform="translate(90 92)" fill="none" stroke="#dce9e2" stroke-width="1.3" opacity=".6">
        <path d="M-46 -28 L-6 -14 M-46 -28 L-6 14 M-46 0 L-6 -14 M-46 0 L-6 14 M-46 28 L-6 -14 M-46 28 L-6 14
                 M-6 -14 L38 0 M-6 14 L38 0"/>
        <g fill="#17524a">
          <circle cx="-46" cy="-28" r="5"/><circle cx="-46" cy="0" r="5"/><circle cx="-46" cy="28" r="5"/>
          <circle cx="-6" cy="-14" r="5"/><circle cx="-6" cy="14" r="5"/>
        </g>
        <circle cx="38" cy="0" r="6" fill="#f3bd8c" stroke="#f3bd8c"/>
      </g>
      <text x="16" y="160" font-size="14" letter-spacing="1.6" fill="#f2f5f1">THE MODEL</text>
      <text x="16" y="178" font-size="11.5" fill="#a9c6ba">one you already have,</text>
      <text x="16" y="194" font-size="11.5" fill="#a9c6ba">or one WISP trains</text>
    </g>
    <path d="M438 214 h20" stroke="#cfe4da" stroke-width="1.2" fill="none" marker-end="url(#wf-arrow)" opacity=".75"/>

    <!-- ===== 3. attributor ===== -->
    <g transform="translate(464 116)">
      <rect width="180" height="196" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="16" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">03</text>
      <g transform="translate(34 46)">
        <g fill="none" stroke="#dce9e2" stroke-width="1.6" opacity=".5">
          <path d="M0 10 l16 -9 l16 9 v18 l-16 9 l-16 -9 z"/>
        </g>
        <circle cx="16" cy="1" r="9" fill="none" stroke="#f0b27f" stroke-width="1.4" stroke-dasharray="3 3"/>
        <g font-size="11" fill="#f3bd8c" font-family="ui-monospace,SFMono-Regular,monospace">
          <text x="54" y="-2">N</text><text x="76" y="-2">O</text><text x="98" y="-2">F</text>
        </g>
        <path d="M34 2 h14" stroke="#f0b27f" stroke-width="1" opacity=".6" fill="none"/>
        <g stroke="#9fd8c4" stroke-width="1.2" fill="none" opacity=".75">
          <path d="M16 42 v16"/>
          <path d="M8 58 h16"/>
        </g>
        <g font-size="10.5" fill="#a9c6ba">
          <text x="34" y="52">prediction moves</text>
          <text x="34" y="68">by how much?</text>
        </g>
      </g>
      <text x="16" y="160" font-size="14" letter-spacing="1.6" fill="#f2f5f1">THE ATTRIBUTOR</text>
      <text x="16" y="178" font-size="11.5" fill="#a9c6ba">swap one atom, see</text>
      <text x="16" y="194" font-size="11.5" fill="#a9c6ba">how far the output moves</text>
    </g>
    <path d="M650 214 h20" stroke="#cfe4da" stroke-width="1.2" fill="none" marker-end="url(#wf-arrow)" opacity=".75"/>

    <!-- ===== 4. scores ===== -->
    <g transform="translate(676 116)">
      <rect width="180" height="196" rx="5" fill="#0f453c" opacity=".4" stroke="#5e9183" stroke-width="1"/>
      <text x="16" y="28" font-size="11.5" letter-spacing="1.6" fill="#f0b27f">04</text>
      <g transform="translate(26 44)">
        <rect width="128" height="76" rx="3" fill="none" stroke="#5e9183" stroke-width="1" opacity=".8"/>
        <path d="M14 64 H116 M14 64 V12" stroke="#8fb3a6" stroke-width="1" fill="none"/>
        <path d="M14 64 L112 14" stroke="#f0b27f" stroke-width="1.1" stroke-dasharray="4 4" opacity=".8"/>
        <g fill="#dff0e7" opacity=".85">
          <circle cx="28" cy="56" r="2.4"/><circle cx="42" cy="48" r="2.4"/><circle cx="38" cy="42" r="2.4"/>
          <circle cx="56" cy="40" r="2.4"/><circle cx="64" cy="32" r="2.4"/><circle cx="78" cy="26" r="2.4"/>
          <circle cx="92" cy="20" r="2.4"/><circle cx="52" cy="54" r="2.4" opacity=".5"/>
        </g>
      </g>
      <text x="16" y="160" font-size="14" letter-spacing="1.6" fill="#f2f5f1">THE SCORE</text>
      <text x="16" y="178" font-size="11.5" fill="#a9c6ba">a number per dataset,</text>
      <text x="16" y="194" font-size="11.5" fill="#a9c6ba">not a gut feeling</text>
    </g>

    <!-- footer -->
    <path d="M40 346 H840" stroke="#7fa99b" stroke-width="1" stroke-dasharray="4 4" opacity=".4"/>
    <g font-size="12.5" fill="#a9c6ba">
      <text x="40" y="374" letter-spacing=".4">
        Because step 3 only needs predictions on slightly altered molecules, it works on a graph network, a
      </text>
      <text x="40" y="394" letter-spacing=".4">
        random forest on fingerprints, or anything else that turns a SMILES string into a number.
      </text>
    </g>
  </g>
</svg>
